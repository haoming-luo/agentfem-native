name: native-fast-ci

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
      - "NOTICE"
  workflow_dispatch:

concurrency:
  group: fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install one development environment
        run: python -m pip install --upgrade pip setuptools wheel build ruff ".[scipy]"
      - name: Check formatting and lints
        run: |
          python -m ruff check .
          python -m ruff format --check src tests benchmarks tools
      - name: Run mathematical and provider tests
        run: python -m unittest discover -v
      - name: Run portable contract example
        run: python -m agentfem_native.cli examples/steady_diffusion_request.json --artifact-directory work/ci-artifacts --result work/ci-result.json
      - name: Check independent lineage
        run: python tools/check_independence.py
