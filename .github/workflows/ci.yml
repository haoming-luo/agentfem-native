name: cross-platform-reference-kernel

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Require a CPython Stable ABI platform wheel
        run: python -c "import glob; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1 and '-abi3-' in wheels[0], wheels"
      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
      - name: Run mathematical tests
        run: python -m unittest discover -v
      - name: Run portable contract example
        run: python -m agentfem_native.cli examples/steady_diffusion_request.json --artifact-directory work/ci-artifacts --result work/ci-result.json
      - name: Check independent lineage
        run: python tools/check_independence.py

  scipy-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sparse provider
        run: python -m pip install --upgrade pip .[scipy]
      - name: Run sparse-provider and scientific tests
        run: python -m unittest discover -v

  cpp20-spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure standard-library C++20 spike
        run: cmake -S native_spikes/cpp20 -B work/cpp20-build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++20 spike
        run: cmake --build work/cpp20-build --config Release
      - name: Test C++20 numerical contract
        run: ctest --test-dir work/cpp20-build -C Release --output-on-failure

  cpp20-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 spike with sanitizers
        run: cmake -S native_spikes/cpp20 -B work/cpp20-sanitize -DCMAKE_BUILD_TYPE=Debug -DAFN_ENABLE_SANITIZERS=ON
      - name: Build sanitized C++20 spike
        run: cmake --build work/cpp20-sanitize
      - name: Test sanitized C++20 numerical contract
        run: ctest --test-dir work/cpp20-sanitize --output-on-failure

  language-abi-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +1.98.1 fmt --manifest-path native_spikes/rust/Cargo.toml -- --check
      - name: Check Rust lints
        run: cargo +1.98.1 clippy --locked --manifest-path native_spikes/rust/Cargo.toml -- -D warnings
      - name: Build and test dependency-free Rust comparator
        run: cargo +1.98.1 test --release --locked --manifest-path native_spikes/rust/Cargo.toml
      - name: Build Rust C ABI library
        run: cargo +1.98.1 build --release --locked --manifest-path native_spikes/rust/Cargo.toml
      - name: Install packaged C++20 runtime
        run: python -m pip install --upgrade pip .
      - name: Compare C++20, Rust, and NumPy complete outputs
        run: python tools/verify_language_equivalence.py
