[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfem-native"
version = "0.4.0a1"
description = "The independently developed finite-element engine for AgentFEM."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "AgentFEM Native contributors" }]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["build>=1", "ruff>=0.8"]
scipy = ["scipy>=1.12"]

[project.scripts]
agentfem-native = "agentfem_native.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentfem_native = ["schemas/*.json"]

[tool.setuptools.exclude-package-data]
agentfem_native = ["*.cpp"]
